[package]
name = "windmark-compatibility-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
tokio = ["windmark/tokio", "dep:tokio"]
async-std = ["windmark/async-std"]
auto-deduce-mime = ["windmark/auto-deduce-mime"]

[dependencies]
windmark = { path = "../..", default-features = false }
rossweisse = { path = "../../rossweisse" }
async-trait = "0.1.92"
tokio = { version = "1.54.1", optional = true, features = ["macros", "rt"] }
